[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Enterprise AI Customer Support Agent (learning project; design in docs/, contract in SPEC.md)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "temporalio>=1.8",
    "qdrant-client>=1.12,<1.13",  # keep in step with the qdrant/qdrant:v1.12.4 image in deploy/compose.yaml
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cedarpy>=4.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "httpx>=0.27",
    "anthropic>=0.40",
    "boto3>=1.35",
    "pydantic>=2.9",
]

[project.optional-dependencies]
console = ["streamlit>=1.40"]
load = ["locust>=2.32"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
