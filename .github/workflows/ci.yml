name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,console,load]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q

  release-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m core.release_paths "origin/${{ github.base_ref }}"
        env:
          RELEASE_ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'scheduled-release') }}
